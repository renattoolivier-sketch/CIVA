<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <!-- Shield Outline Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <!-- Lens Gradient -->
    <radialGradient id="lens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="70%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Subtle Tech Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="20,15" />
  
  <!-- Sleek Glowing Shield Protection (Behind Camera) -->
  <path d="M256,70 C340,70 395,90 410,140 C410,240 370,340 256,430 C142,340 102,240 102,140 C117,90 172,70 256,70 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="drop-shadow(0 8px 16px rgba(30, 64, 175, 0.4))" />

  <!-- Shield Inner Fill Accent -->
  <path d="M256,86 C326,86 372,102 384,142 C384,222 352,302 256,380 C160,302 128,222 128,142 C140,102 186,86 256,86 Z" 
        fill="#1e293b" 
        fill-opacity="0.3" />

  <!-- Group of Security Camera Vectors (Centered) -->
  <g transform="translate(141, 141)" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.5))">
    <!-- Camera Body/Housing -->
    <path d="M30,70 L150,40 C160,37 170,43 173,53 L193,113 C196,123 190,133 180,136 L60,166 C50,169 40,163 37,153 L17,93 C14,83 20,73 30,70 Z" 
          fill="#ffffff" />
    <!-- Camera Lens Hood / Lens Ring -->
    <path d="M150,40 L165,36 C175,33 185,39 188,49 L198,79 C201,89 195,99 185,102 L170,106 Z" 
          fill="#cbd5e1" />
    <!-- Camera InfraRed LED Ring -->
    <ellipse cx="178" cy="74" rx="14" ry="25" fill="#334155" transform="rotate(15 178 74)" />
    <!-- Main Glowing Lens -->
    <ellipse cx="178" cy="74" rx="7" ry="12" fill="url(#lens)" transform="rotate(15 178 74)" />
    <!-- Lens Glow Dot -->
    <circle cx="175" cy="70" r="3" fill="#38bdf8" />
    <!-- Camera Mount/Bracket Assembly -->
    <path d="M60,150 L60,190 C60,198 68,205 76,205 L116,205 L116,220" 
          fill="none" 
          stroke="#e2e8f0" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <path d="M96,190 L136,190 L136,220" 
          fill="none" 
          stroke="#cbd5e1" 
          stroke-width="12" 
          stroke-linecap="round" />
    <rect x="80" y="215" width="70" height="15" rx="5" fill="#94a3b8" />
  </g>

  <!-- Stylized Status Ring (Shield Central Glow) -->
  <circle cx="256" cy="380" r="16" fill="#10b981" filter="url(#glow)" />
  <circle cx="256" cy="380" r="8" fill="#ffffff" />
</svg>
